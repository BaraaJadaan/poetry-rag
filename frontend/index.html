<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>باحث الشعر العربي</title>
    <link rel="stylesheet" href="style.css?v=2">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="glass-header">
        <h1>باحث الشعر العربي</h1>
        <div class="header-controls">
            <button id="clear-cache-btn" title="مسح المحادثات المحفوظة">🗑 مسح السجل</button>
        </div>
    </header>

    <main id="chat-container">
        <div id="messages"></div>
        <div class="input-area glass-input">
            <textarea id="user-input" placeholder="اكتب وصفاً أو شعوراً للبحث عن أبيات تناسبه... (مثال: الشوق والفراق)"></textarea>
            <button id="stop-btn" style="display: none; background: #ef4444;" aria-label="إيقاف">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <button id="send-btn" aria-label="إرسال">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </div>
    </main>

    <script src="config.js?v=2"></script>
    <script src="script.js"></script>
</body>
</html>
