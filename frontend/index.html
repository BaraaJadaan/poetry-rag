<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>باحث الشعر العربي</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header class="glass-header">
        <h1>باحث الشعر العربي</h1>
        <div class="header-controls">
            <button id="clear-cache-btn" title="مسح المحادثات المحفوظة">🗑 مسح السجل</button>
            <div class="toggle-container">
                <span>محلي (Local)</span>
                <label class="switch">
                    <input type="checkbox" id="backend-toggle">
                    <span class="slider round"></span>
                </label>
                <span title="يتطلب اتصالاً بالإنترنت ومفتاح API">🌐 API (إنترنت)</span>
            </div>
        </div>
    </header>

    <main id="chat-container">
        <div id="messages"></div>
        <div class="input-area glass-input">
            <textarea id="user-input" placeholder="اكتب وصفاً أو شعوراً للبحث عن أبيات تناسبه... (مثال: الشوق والفراق)"></textarea>
            <button id="stop-btn" style="display: none; background: #ef4444;">إيقاف</button>
            <button id="send-btn">إرسال</button>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
