[project]
name = "poetry-rag"
version = "0.1.0"
description = "Production-grade Arabic Poetry RAG system with LanceDB hybrid retrieval and native ReAct agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.0.0",
    "fastapi>=0.141.1",
    "huggingface-hub",
    "lancedb>=0.36.0",
    "openai>=2.53.0",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "setuptools>=65.0.0,<71",
    "sse-starlette>=3.4.8",
    "tantivy>=0.26.0",
    "tqdm>=4.69.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0.0",
]

mlops = [
    "mlflow>=3.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
