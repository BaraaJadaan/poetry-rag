name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        run: uv sync --locked --dev --no-group mlops

      - name: Run unit and retrieval regression tests
        run: uv run pytest -q

      - name: Build Docker image
        run: docker build --tag poetry-rag:${{ github.sha }} .
