name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Install locked dependencies
        # The regression fixture does not use the local LLM. The project keeps a
        # Windows-only llama-cpp wheel for development, so omit that package from
        # this Linux CI environment. Docker installs the Linux package separately.
        run: uv sync --locked --dev --no-group mlops --no-install-package llama-cpp-python

      - name: Run unit and retrieval regression tests
        run: uv run pytest -q

      - name: Build Docker image
        run: docker build --tag poetry-rag:${{ github.sha }} .
