version: '3.8'

services:
  web:
    build: .
    ports:
      # ngrok is the public entry point. Keep FastAPI local to the VM.
      - "127.0.0.1:8000:8000"
    volumes:
      # Use named volumes to persist data across container restarts
      - lancedb_data:/app/lancedb
      - model_data:/app/models
    env_file:
      - .env
    environment:
      - CLOUD_DEPLOYMENT=true
    restart: unless-stopped

  # ngrok exposes FastAPI over HTTPS with a stable URL. The free plan includes
  # one permanent static domain; token and domain come from the server's .env.
  ngrok:
    image: ngrok/ngrok:latest
    command: http --url=${NGROK_STATIC_DOMAIN} web:8000
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    restart: unless-stopped
    depends_on:
      - web

volumes:
  lancedb_data:
  model_data:
