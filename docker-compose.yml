version: '3.8'

services:
  web:
    build: .
    ports:
      # Cloudflared is the public entry point. Keep FastAPI local to the VM.
      - "127.0.0.1:8000:8000"
    volumes:
      # Use named volumes to persist data across container restarts
      - lancedb_data:/app/lancedb
      - model_data:/app/models
    env_file:
      - .env
    environment:
      - CLOUD_DEPLOYMENT=true
    restart: unless-stopped

  # Remotely-managed Cloudflare Tunnel. The token comes from the server's .env file.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - web

volumes:
  lancedb_data:
  model_data:
